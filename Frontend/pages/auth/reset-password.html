<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعادة تعيين كلمة المرور | EccatOne</title>
    <meta name="description" content="أدخل كلمة المرور الجديدة لاستعادة الوصول إلى حسابك" />
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>
    <nav>
      <div class="navbar">
        <a class="nav-brand" href="../../LandingPage.html">
          <img src="../../assets/logo.svg" alt="EccatOne Logo" />
          <span class="nav-brand-text">EccatOne</span>
        </a>
        <ul class="nav-links">
          <li><a href="login.html" class="nav-cta">تسجيل الدخول</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="auth-card">
        <div class="form-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2Zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2Z"/>
          </svg>
        </div>

        <h1 class="form-title">تعيين كلمة مرور جديدة</h1>
        <p class="form-subtitle">أدخل كلمة مرورك الجديدة أدناه.</p>

        <!-- Error / success messages -->
        <div id="errorMsg" style="display:none;background:#fef2f2;border:1.5px solid #fca5a5;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:1.35rem;margin-bottom:14px;text-align:right;"></div>
        <div id="successMsg" class="success-msg">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <p>تم تغيير كلمة المرور بنجاح! سيتم توجيهك لتسجيل الدخول...</p>
        </div>

        <form id="resetForm" novalidate>
          <div class="input-group">
            <label for="password">كلمة المرور الجديدة</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="••••••••" required />
            </div>
          </div>

          <div class="input-group">
            <label for="passwordConfirm">تأكيد كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="passwordConfirm" placeholder="••••••••" required />
            </div>
          </div>

          <button type="submit" class="btn-primary" id="resetBtn">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            تعيين كلمة المرور
          </button>
        </form>

        <div class="back-link-wrapper">
          <a href="login.html" class="back-link" id="backToLogin">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            العودة لتسجيل الدخول
          </a>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2024 EccatOne. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="../../config.js"></script>
    <script src="reset-password.js"></script>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </body>
</html>

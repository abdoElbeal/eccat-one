<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نسيت كلمة المرور | EccatOne</title>
    <meta name="description" content="أعد تعيين كلمة المرور لاستعادة الوصول إلى حسابك على EccatOne" />
    <link rel="stylesheet" href="forgot-password.css" />
  </head>
  <body>

    <!-- ─── Navbar ─── -->
    <nav>
      <div class="navbar">
        <a class="nav-brand" href="../../LandingPage.html">
          <img src="../../assets/logo.svg" alt="EccatOne Logo" />
          <span class="nav-brand-text">أمانكم</span>
        </a>
        <ul class="nav-links">
          <li><a href="../../LandingPage.html">الرئيسية</a></li>
          <li><a href="../../LandingPage.html#services">الخدمات</a></li>
          <li><a href="../../LandingPage.html#contact">اتصل بنا</a></li>
          <li><a href="login.html" class="nav-cta">تسجيل الدخول</a></li>
        </ul>
      </div>
    </nav>

    <!-- ─── Main ─── -->
    <main>
      <div class="auth-card">

        <!-- Icon -->
        <div class="form-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2Zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2Z"/>
          </svg>
        </div>

        <h1 class="form-title">هل نسيت كلمة السر؟</h1>
        <p class="form-subtitle">
          لا تقلق، أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً<br>لإعادة تعيين كلمة المرور الخاصة بك.
        </p>

        <form id="forgotForm" novalidate>

          <!-- Email -->
          <div class="input-group">
            <label for="resetEmail">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <input type="email" id="resetEmail" placeholder="example@domain.com" autocomplete="email" required />
              <span class="input-icon">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>
              </span>
            </div>
          </div>

          <!-- Send button -->
          <button type="submit" class="btn-primary" id="resetBtn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            إرسال رابط التعيين
          </button>

          <!-- Success message (hidden until sent) -->
          <div class="success-msg" id="successMsg">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            <p>تم إرسال الرابط! تحقق من بريدك الإلكتروني.</p>
          </div>
        </form>

        <!-- Back to login -->
        <div class="back-link-wrapper">
          <a href="login.html" class="back-link" id="backToLogin">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            العودة لتسجيل الدخول
          </a>
        </div>

      </div>
    </main>

    <!-- ─── Footer ─── -->
    <footer>
      <p>© 2024 اسم الشركة. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="../../config.js"></script>
    <script src="forgot-password.js"></script>

    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الإعلانات | بوابة الطالب</title>
    <link rel="stylesheet" href="user.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      .ann-hero {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border-radius: 20px; padding: 30px 40px; color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 24px; position: relative; overflow: hidden;
      }
      .hero-text h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
      .hero-text p { font-size: 1.4rem; color: #94a3b8; }
      
      .ann-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
      .ann-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; display: flex; flex-direction: column; gap: 16px; transition: all 0.3s; }
      .ann-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); border-color: #cbd5e1; }
      .ann-card.pinned { border-right: 4px solid #f59e0b; }
      .ann-card.urgent { border-top: 4px solid #ef4444; }
      
      .ac-header { display: flex; justify-content: space-between; align-items: flex-start; }
      .ac-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
      .bg-blue { background: #eff6ff; color: #3b82f6; }
      .bg-red { background: #fef2f2; color: #ef4444; }
      .bg-green { background: #f0fdf4; color: #10b981; }
      .bg-orange { background: #fff7ed; color: #f59e0b; }
      .bg-purple { background: #f5f3ff; color: #8b5cf6; }

      .ac-title { font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-top: 12px; line-height: 1.4; }
      .ac-content { font-size: 1.35rem; color: #475569; line-height: 1.6; }
      
      .ac-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid #f1f5f9; font-size: 1.15rem; color: #94a3b8; }
      
      .ac-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
      .ac-badge { padding: 4px 10px; border-radius: 20px; font-size: 1.1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
      .empty-state { grid-column: 1/-1; text-align: center; padding: 60px; color: #94a3b8; font-size: 1.4rem; }
    </style>
  </head>

          <a href="grades.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>الدرجات</a>

          <a href="support.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>الدعم الفني</a>
        </nav>

          <a href="dashboard.html" class="topbar-logo">Academic Curator</a>

        <main class="page-body">
          <div class="ann-hero">

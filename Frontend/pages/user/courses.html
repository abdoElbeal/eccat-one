<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كورساتي | بوابة الطالب</title>
    <meta name="description" content="إدارة ومتابعة مقرراتك الدراسية" />
    <link rel="stylesheet" href="user.css" />
    <link rel="stylesheet" href="courses.css" />
  </head>
  <body>
    <div class="portal-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <a href="dashboard.html" class="sidebar-brand">
          <div class="sidebar-brand-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5ZM2 15l10 5 10-5M2 10l10 5 10-5"/></svg></div>
          <div class="sidebar-brand-text"><strong>بوابة الطالب</strong><span>جامعة التميز</span></div>
        </a>
        <nav class="sidebar-nav">

          <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>لوحة القيادة</a>
          <a href="courses.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>كورساتي</a>
          <a href="schedule.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>الجدول الزمني</a>
          <a href="grades.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>الدرجات</a>
          <a href="announcements.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"/></svg>الإعلانات</a>
          <a href="leaderboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>لوحة المتصدرين</a>
          <a href="messages.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>الرسائل</a>
          <a href="support.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>الدعم الفني</a>
        </nav>
        <div class="sidebar-footer">

          <button class="support-btn" id="supportBtn">الدعم الفني</button>
          <a href="../shared/profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>الإعدادات</a>
          <button class="nav-item logout" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>تسجيل الخروج</button>
        </div>
      </aside>

      <div class="portal-main">
        <!-- Topbar -->
        <header class="topbar">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="فتح القائمة" aria-expanded="false"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-avatar" id="topbarAvatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <button class="topbar-icon-btn" id="notifBtn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></button>
          <a href="dashboard.html" class="topbar-logo">Academic Curator</a>
        </header>

        <main class="page-body">
          <!-- Page Header -->
          <div class="courses-page-header">
            <div>
              <h1>كورساتي الأكاديمية</h1>
              <p class="text-muted" id="headerSubtitle">جارٍ التحميل...</p>
            </div>
            <!-- Tracker Controls -->
            <div class="tracker-controls">
              <select id="yearFilter" class="tracker-select">
                <option value="">كل السنوات</option>
                <option value="2025/2026">2025/2026</option>
                <option value="2024/2025">2024/2025</option>
                <option value="2023/2024">2023/2024</option>
                <option value="2022/2023">2022/2023</option>
              </select>
              <select id="semesterFilter" class="tracker-select">
                <option value="">كل الفصول</option>
                <option value="1">الفصل الأول</option>
                <option value="2">الفصل الثاني</option>
              </select>
              <button class="tracker-reset-btn" id="resetFilters" title="عرض الفصل الحالي">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                الحالي
              </button>
            </div>
          </div>

          <!-- Summary Bar -->
          <div class="courses-summary" id="coursesSummary" style="display:none;">
            <div class="summary-chip">
              <span id="sumTotal">0</span>
              <label>مادة</label>
            </div>
            <div class="summary-chip passed">
              <span id="sumPassed">0</span>
              <label>ناجح</label>
            </div>
            <div class="summary-chip failed">
              <span id="sumFailed">0</span>
              <label>راسب</label>
            </div>
            <div class="summary-chip inprogress">
              <span id="sumInProgress">0</span>
              <label>جارٍ</label>
            </div>
            <div class="summary-chip gpa">
              <span id="sumAvg">—</span>
              <label>متوسط الدرجات</label>
            </div>
          </div>

          <!-- Courses Grid -->
          <div class="courses-grid" id="coursesGrid">
            <!-- Filled by JS -->
          </div>
        </main>
      </div>
    </div>

    <!-- Course Detail Modal -->
    <div id="courseModal" class="modal-overlay" style="display:none;" onclick="handleModalOverlayClick(event)">
      <div class="modal course-detail-modal">
        <div class="modal-header">
          <div>
            <h3 id="mCourseName">تفاصيل المقرر</h3>
            <p id="mCourseCode" style="font-size:1.2rem; color:#64748b; margin-top:2px;"></p>
          </div>
          <button class="modal-close" onclick="closeCourseModal()">✕</button>
        </div>
        <div class="modal-body" id="mCourseBody"></div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeCourseModal()">إغلاق</button>
        </div>
      </div>
    </div>

    <script src="../../config.js"></script>
    <script src="../shared/portal-utils.js"></script>
    <script src="courses.js"></script>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <script src="../shared/sidebar-toggle.js"></script>

  </body>
</html>

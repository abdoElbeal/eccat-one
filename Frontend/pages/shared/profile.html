<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | EccatOne</title>
    <link rel="stylesheet" href="../user/user.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="portal-layout">
        <!-- Sidebar will be injected or same as portal -->
        <aside class="sidebar">
            <a href="#" class="sidebar-brand">
                <div class="sidebar-brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="sidebar-brand-text">
                    <strong>إيكات</strong>
                    <span>منصتي</span>
                </div>
            </a>
            <nav class="sidebar-nav">
                <a href="javascript:history.back()" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    العودة للخلف
                </a>
                <div style="flex:1"></div>
            </nav>
            <div class="sidebar-footer">
                <button class="nav-item logout" id="logoutBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    تسجيل الخروج
                </button>
            </div>
        </aside>

        <main class="portal-main">
            <header class="topbar">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="فتح القائمة" aria-expanded="false"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <h1 style="font-size:1.8rem; font-weight:800; color:var(--brand-color);">إعدادات الحساب</h1>
                <div style="flex:1"></div>
                <div class="topbar-user-info">
                    <strong id="userNameTop">جاري التحميل...</strong>
                    <span id="userRoleTop">طالب</span>
                </div>
                <div class="topbar-avatar" id="topbarAvatar">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
            </header>

            <div class="page-body">
                <div class="profile-container">
                    <!-- Left: Profile Info -->
                    <div class="profile-main-card">
                        <div class="pmc-header">
                            <div class="avatar-upload">
                                <div class="avatar-preview">
                                    <div id="imagePreview" style="background-image: url('../../assets/default-avatar.png');"></div>
                                </div>
                                <div class="avatar-edit">
                                    <input type='file' id="imageUpload" accept=".png, .jpg, .jpeg" />
                                    <label for="imageUpload"></label>
                                </div>
                            </div>
                            <div class="pmc-info">
                                <h2 id="userNameFull">الاسم الكامل</h2>
                                <p id="userEmail">example@domain.com</p>
                                <span class="badge badge-blue" id="userRoleBadge">طالب</span>
                            </div>
                        </div>

                        <div class="pmc-body">
                            <div class="input-grid">
                                <div class="input-group">
                                    <label>الاسم المستعار</label>
                                    <input type="text" id="nicknameInput" placeholder="أدخل اسم الشهرة">
                                </div>
                                <div class="input-group">
                                    <label>رقم الهاتف</label>
                                    <input type="text" id="phoneInput" placeholder="01XXXXXXXXX">
                                </div>
                                <div class="input-group" style="grid-column: 1 / -1;">
                                    <label>العنوان</label>
                                    <input type="text" id="addressInput" placeholder="العنوان بالتفصيل">
                                </div>
                            </div>
                            <button class="btn btn-primary" id="saveProfileBtn">حفظ التغييرات</button>
                        </div>
                    </div>

                    <!-- Right: Password & Security -->
                    <div class="profile-side-cards">
                        <div class="panel">
                            <div class="panel-header"><h2>تغيير كلمة المرور</h2></div>
                            <div class="panel-body">
                                <div class="input-group">
                                    <label>كلمة المرور الحالية</label>
                                    <input type="password" id="oldPassword" placeholder="••••••••">
                                </div>
                                <div class="input-group">
                                    <label>كلمة المرور الجديدة</label>
                                    <input type="password" id="newPassword" placeholder="••••••••">
                                </div>
                                <div class="input-group">
                                    <label>تأكيد كلمة المرور</label>
                                    <input type="password" id="confirmPassword" placeholder="••••••••">
                                </div>
                                <button class="btn btn-outline w-full" id="changePassBtn">تحديث كلمة المرور</button>
                            </div>
                        </div>

                        <div class="panel mt-20">
                            <div class="panel-header"><h2>معلومات إضافية</h2></div>
                            <div class="panel-body">
                                <div class="info-row">
                                    <span>الرقم القومي:</span>
                                    <strong id="nationalIdInfo">—</strong>
                                </div>
                                <div class="info-row">
                                    <span>تاريخ الانضمام:</span>
                                    <strong id="joinDateInfo">—</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <script src="../../config.js"></script>
    <script src="portal-utils.js"></script>
    <script src="profile.js"></script>
    <script src="sidebar-toggle.js"></script>
</body>
</html>

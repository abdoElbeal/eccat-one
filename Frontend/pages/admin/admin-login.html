<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول المشرف | إدارة الكلية</title>
    <meta name="description" content="لوحة تحكم مشرف نظام إدارة الكلية - دخول آمن" />
    <link rel="stylesheet" href="admin-login.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- Left panel -->
      <div class="login-panel">
        <div class="panel-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5ZM2 15l10 5 10-5M2 10l10 5 10-5"/></svg>
          </div>
          <div class="brand-text">
            <strong>إدارة الكلية</strong>
            <span>نظام إدارة الكلية</span>
          </div>
        </div>

        <div class="panel-content">
          <h2>مرحباً بك في<br />لوحة الإدارة</h2>
          <p>قم بتسجيل الدخول للوصول إلى لوحة تحكم المشرف وإدارة المستخدمين والمقررات.</p>

          <ul class="panel-features">
            <li>
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              إدارة المستخدمين والطلاب
            </li>
            <li>
              <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              متابعة الأقسام والمقررات
            </li>
            <li>
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              إدارة رموز التسجيل
            </li>
          </ul>
        </div>
      </div>

      <!-- Right form -->
      <div class="login-form-side">
        <div class="form-card">
          <div class="form-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <h1 class="form-title">دخول المشرف</h1>
          <p class="form-subtitle">هذه الصفحة مخصصة لمديري النظام فقط</p>

          <form id="adminLoginForm" novalidate>
            <div class="field-g">
              <label for="email">البريد الإلكتروني</label>
              <div class="input-wrap">
                <input type="email" id="email" placeholder="admin@college.edu" autocomplete="email" required />
                <span class="inp-icon">
                  <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>
                </span>
              </div>
            </div>

            <div class="field-g">
              <label for="password">كلمة المرور</label>
              <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
                <button type="button" class="toggle-pw" id="togglePw" aria-label="إظهار/إخفاء">
                  <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5ZM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3Z"/></svg>
                </button>
              </div>
            </div>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <button type="submit" class="login-btn" id="loginBtn">
              <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
              تسجيل الدخول
            </button>
          </form>

          <p class="back-note">
            <a href="../../LandingPage.html">
              <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              العودة للصفحة الرئيسية
            </a>
          </p>
        </div>
      </div>
    </div>

    <script src="../../config.js"></script>
    <script src="admin-login.js"></script>
  </body>
</html>

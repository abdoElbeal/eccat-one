    <meta charset="UTF-8" />

    <title>إدارة الدرجات | لوحة الإدارة</title>
    <link rel="stylesheet" href="admin.css" />
    <style>
      .grade-input { width: 70px; padding: 6px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; text-align: center; font-size: 1.3rem; font-family: inherit; transition: all .15s; }
      .grade-input:focus { border-color: #2463eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); outline: none; }
      .grade-input.changed { border-color: #f59e0b; background: #fffbeb; }
      .total-display { font-weight: 700; font-size: 1.4rem; color: #1e293b; }
      .total-display.unset { color: #94a3b8; font-weight: 400; }
      .grade-letter { display: inline-block; padding: 2px 10px; border-radius: 8px; font-weight: 700; font-size: 1.2rem; min-width: 36px; text-align: center; }
      .grade-letter.unset { background: #f1f5f9; color: #94a3b8; font-weight: 400; }
      .grade-save-btn { background: #f1f5f9; border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; color: #64748b; }
      .grade-save-btn:hover { background: #e2e8f0; color: #1e293b; }
      .grade-save-btn.saved { background: #dcfce7; color: #16a34a; }
      .grade-save-btn svg { width: 18px; height: 18px; fill: currentColor; }
      .filters-panel { background: #fff; border-radius: 16px; border: 1.5px solid #e2e8f0; padding: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .filter-group { display: flex; flex-direction: column; gap: 6px; }
      .filter-group label { font-size: 1.2rem; font-weight: 600; color: #64748b; }
      .filter-group select { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1.3rem; outline: none; min-width: 200px; }
    </style>
  </head>

      <!-- Main -->
      <div class="admin-main">
        <header class="topbar">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="فتح القائمة" aria-expanded="false"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <div class="topbar-left">
            <h1 class="topbar-title">إدارة الدرجات</h1>
            <span class="topbar-sub">رصد وتعديل درجات الطلاب</span>
          </div>
          <div class="topbar-actions">
            <div class="topbar-avatar" id="topbarAvatar"></div>
          </div>
        </header>

        <div class="page-body">
          <!-- Filters -->
          <div class="filters-panel">
            <div class="filter-group">
              <label>القسم</label>
              <select id="deptSelect"><option value="">اختر القسم...</option></select>
            </div>
            <div class="filter-group">
              <label>المادة</label>
              <select id="subjectSelect" disabled><option value="">اختر المادة...</option></select>
            </div>
            <div class="filter-group">
              <label>المجموعة</label>
              <select id="groupSelect" disabled><option value="all">كل المجموعات</option></select>
            </div>
            <button class="btn btn-primary" style="margin-top:20px;padding:10px 24px;" id="loadGradesBtn">عرض الطلاب</button>
            <div style="margin-right:auto;display:flex;gap:10px;margin-top:20px;">
              <button class="btn btn-green" id="saveAllBtn" disabled>حفظ الكل</button>
              <button class="btn btn-ghost" id="exportBtn" disabled>تصدير CSV</button>
            </div>
          </div>

          <!-- Table -->
          <div class="panel">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>الطالب</th>
                    <th>أعمال السنة (20)</th>
                    <th>منتصف الفصل (30)</th>
                    <th>الامتحان النهائي (50)</th>
                    <th>المجموع (100)</th>
                    <th>التقدير</th>
                    <th>إجراء</th>
                  </tr>
                </thead>
                <tbody id="gradesTable">
                  <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;">يرجى اختيار القسم والمادة أولاً</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
